appId: app.lumitrack.desktop
productName: Lumitrack
copyright: Uso personal. No comercial.

directories:
  output: ../installer/dist
  buildResources: ../installer/build

files:
  - "**/*"
  - "!bin/**"
  - "!start.js"
  - "!Lumitrack.bat"
  - "!**/*.md"
  - "!**/*.map"
  - "!node_modules/@biomejs/**"

asar: true
asarUnpack:
  - public/**

extraResources:
  - from: bin
    to: bin
    filter:
      - yt-dlp.exe
      - yt-dlp
      - ffmpeg.exe
      - ffmpeg
  - from: ../installer/build/icon.png
    to: icon.png

# GitHub Releases: genera latest.yml para electron-updater.
# Publicar con: npm run dist:publish (requiere GH_TOKEN).
publish:
  provider: github
  owner: nicolasfernandezriesen
  repo: Lumitrack
  releaseType: release

win:
  icon: icon.ico
  target:
    - target: nsis
      arch:
        - x64
  artifactName: Lumitrack-Setup-${version}.${ext}

nsis:
  oneClick: false
  # El borrado de datos de usuario lo decide installer.nsh. Por defecto
  # se borra %APPDATA%\Lumitrack; el desinstalador puede conservarla.
  # En una actualización (--updated) esa carpeta no se toca.
  deleteAppDataOnUninstall: false
  # Instalación para la máquina: la ruta por defecto es
  # C:\Program Files\Lumitrack (en Windows en español se ve como Archivos de programa).
  perMachine: true
  allowToChangeInstallationDirectory: true
  allowElevation: true
  include: installer.nsh
  installerIcon: icon.ico
  uninstallerIcon: icon.ico
  installerHeaderIcon: icon.ico
  # El asistente pregunta después de la ruta, por el escritorio y por
  # el menú Inicio. Si el usuario desmarca una opción, installer.nsh
  # borra ese acceso directo al terminar.
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: Lumitrack
  uninstallDisplayName: Lumitrack


<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Lumitrack — Visualizador audiorreactivo</title>

<link rel="stylesheet" href="styles/theme.css">
<link rel="stylesheet" href="styles/layout.css">
<link rel="stylesheet" href="styles/player-controls.css">
<link rel="stylesheet" href="styles/panel.css">
<link rel="stylesheet" href="styles/playlist.css">
<link rel="stylesheet" href="styles/components.css">
<link rel="stylesheet" href="styles/updater-modal.css">
</head>
<body>

<div id="stage">
  <div id="ambient"></div>
  <div id="grain"></div>
  <div id="bars-wrap"></div>
</div>

<section id="playback-dock" aria-label="Reproductor y playlist">
  <div id="now-playing">
    <div id="cover-stack" role="button" tabindex="0" aria-controls="playlist-panel"
      aria-label="Mostrar playlist" aria-expanded="false">
      <img id="cover-prev" class="cover-peek cover-peek--prev" alt="" hidden>
      <img id="cover" alt="">
      <img id="cover-next" class="cover-peek cover-peek--next" alt="" hidden>
    </div>

    <div id="player-main">
      <div id="meta">
        <p id="track-title">Nada sonando todavía</p>
        <p id="track-artist">Buscá una canción para empezar</p>
      </div>

      <div id="controls-row">
        <div id="transport" aria-label="Controles de reproducción">
          <button id="prev-track" type="button" title="Anterior" aria-label="Anterior">⏮</button>
          <button id="play-toggle" type="button" title="Reproducir" aria-label="Reproducir">▶</button>
          <button id="next-track" type="button" title="Siguiente" aria-label="Siguiente">⏭</button>
        </div>

        <div id="progress-track">
          <div id="progress-track-hit">
            <div id="progress-buffered"></div>
            <div id="progress-fill"></div>
          </div>
        </div>

        <button id="time-remaining" type="button" aria-label="Mostrar tiempo restante"
          title="Mostrar tiempo restante" aria-pressed="false">00:00/00:00</button>

        <div id="volume-control" class="volume-control">
          <button id="volume-toggle" type="button" title="Mostrar control de volumen"
            aria-label="Mostrar control de volumen" aria-expanded="false">🔊</button>
          <div id="volume-popover" class="volume-popover" hidden>
            <input id="volume-slider" type="range" min="0" max="100" value="100"
              aria-label="Volumen" orient="vertical">
            <button id="mute-toggle" type="button" title="Silenciar" aria-label="Silenciar">🔇</button>
          </div>
        </div>

        <button id="fullscreen-toggle" type="button" title="Pantalla completa"
          aria-label="Pantalla completa" aria-pressed="false"></button>
      </div>
    </div>
  </div>
  <div id="playlist-panel" aria-hidden="true">
    <ol id="playlist-list" aria-label="Canciones siguientes"></ol>
  </div>
</section>
<div id="panel-actions">
  <button id="toggle-search" class="panel-action" type="button" title="Buscar canción"
    aria-label="Buscar canción" aria-controls="panel" aria-expanded="false">
    <svg viewBox="0 0 24 24" aria-hidden="true">
      <circle cx="10.8" cy="10.8" r="6.2"></circle>
      <path d="m15.4 15.4 4.1 4.1"></path>
    </svg>
  </button>
  <button id="toggle-settings" class="panel-action" type="button" title="Configuración"
    aria-label="Configuración" aria-controls="settings-panel" aria-expanded="false">
    <span aria-hidden="true">⚙</span>
  </button>
</div>

<div id="panel" class="top-panel hidden" aria-hidden="true">
  <h2>BUSCAR CANCION</h2>
  <input id="search-input" type="text" placeholder="Buscar canción o artista…">
  <p id="search-status"></p>
  <div id="results-list"></div>
</div>

<div id="settings-panel" class="top-panel hidden" role="dialog"
  aria-label="Configuración" aria-hidden="true">
  <h2>Configuracion</h2>
  <p>Aca ira la configuracion de la APP</p>
</div>

<div id="loading-indicator"><span class="spinner"></span><span>Cargando audio…</span></div>
<div id="status">Beta V.0.5.0</div>

<script type="module" src="scripts/main.js"></script>
</body>
</html>

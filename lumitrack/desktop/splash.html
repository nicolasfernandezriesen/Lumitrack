<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Lumitrack</title>
<style>
  html, body {
    margin: 0;
    height: 100%;
    background: #08080a;
    color: #f2f1ee;
    font-family: "Segoe UI", system-ui, sans-serif;
  }
  body {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 18px;
  }
  h1 {
    margin: 0;
    font-weight: 500;
    font-size: 22px;
    letter-spacing: 0.14em;
  }
  #msg {
    margin: 0;
    max-width: 380px;
    min-height: 2.8em;
    text-align: center;
    color: rgba(242, 241, 238, 0.68);
    font-size: 14px;
    line-height: 1.4;
  }
  .bar {
    width: 160px;
    height: 2px;
    background: #7c8cff;
  }
</style>
</head>
<body>
  <h1>LUMITRACK</h1>
  <div class="bar"></div>
  <p id="msg">Preparando…</p>
</body>
</html>
